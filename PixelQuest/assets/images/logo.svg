<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128" shape-rendering="crispEdges">
  <!-- Retro Pixel Sword & Shield Logo -->
  <rect width="128" height="128" fill="#121626" rx="16"/>
  <rect x="8" y="8" width="112" height="112" fill="#1a1e36" stroke="#f1c40f" stroke-width="4"/>
  
  <!-- Shield Emblem -->
  <rect x="36" y="28" width="56" height="48" fill="#3867d6"/>
  <rect x="40" y="32" width="48" height="40" fill="#4b7bec"/>
  <rect x="48" y="76" width="32" height="16" fill="#3867d6"/>
  <rect x="56" y="92" width="16" height="8" fill="#3867d6"/>

  <!-- Sword Blade -->
  <rect x="60" y="16" width="8" height="76" fill="#ecf0f1"/>
